<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاعتمادات — سطر</title>
<script>try{var _l=JSON.parse(localStorage.getItem('satr_lang')||'"ar"');document.documentElement.lang=_l;document.documentElement.dir=_l==='ar'?'rtl':'ltr';}catch(e){}</script>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="credits" data-theme="dark">
<script>try{document.body.dataset.theme=JSON.parse(localStorage.getItem('satr_theme')||'"dark"')}catch(e){}</script>
<main class="wrap">
  <section>
    <span class="kicker" id="kick"></span>
    <h1 id="h" style="font-size:clamp(1.6rem,4.4vw,2.6rem)"></h1>
    <div class="grid g2" style="margin-top:1.6rem">
      <div class="card cred">
        <h3 id="fH"></h3>
        <p class="muted small" id="fN"></p>
        <p class="small mono" id="fL" style="color:var(--acc2)"></p>
      </div>
      <div class="card cred">
        <h3 id="dH"></h3>
        <p class="muted small" id="dN" style="margin-bottom:0"></p>
      </div>
      <div class="card cred">
        <h3 style="font-family:var(--mono)">LICENSE</h3>
        <p class="muted small" style="margin-bottom:0">Code and content © Zaynab Abu Twyla. Bundled fonts under the SIL Open Font License 1.1 (see assets/fonts/OFL.txt).</p>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
window.PAGE_INIT=function(){
  const A=window.SATR_APP,t=A.T();
  document.title=t.credits.title+' — '+t.brand;
  document.getElementById('kick').textContent=t.nav.credits;
  document.getElementById('h').textContent=t.credits.title;
  document.getElementById('fH').textContent=t.credits.fonts;
  document.getElementById('fN').textContent=t.credits.fontsNote;
  document.getElementById('fL').textContent=t.credits.fontsList;
  document.getElementById('dH').textContent=t.credits.demo;
  document.getElementById('dN').textContent=t.credits.demoNote;
};
</script>
</body>
</html>

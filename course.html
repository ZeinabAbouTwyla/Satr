<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المسار — سطر</title>
<script>try{var _l=JSON.parse(localStorage.getItem('satr_lang')||'"ar"');document.documentElement.lang=_l;document.documentElement.dir=_l==='ar'?'rtl':'ltr';}catch(e){}</script>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="courses" data-theme="dark">
<script>try{document.body.dataset.theme=JSON.parse(localStorage.getItem('satr_theme')||'"dark"')}catch(e){}</script>
<main class="wrap" id="main"></main>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
window.PAGE_INIT=function(){
  const A=window.SATR_APP,t=A.T(),esc=A.esc,L=A.lang();
  const id=new URLSearchParams(location.search).get('id');
  const c=window.SATR.courses.find(x=>x.id===id);
  if(!c){location.replace('courses.html');return}
  const tr=A.trackOf(c.track), tt=A.totals(c);
  const fl=A.flatLessons(c);
  const pct=A.coursePct(c);
  const firstOpen=fl.find(l=>A.isUnlocked(c,l.flat)&&!A.prog.get(c.id,l.flat).done);
  const startLabel=pct>0?t.course.continueFrom:t.course.enroll;
  document.title=c.title[L]+' — '+t.brand;
  const hl=s=>{
    const strs=[];
    let out=esc(s).replace(/(&quot;.*?&quot;|"[^"\n]*"|'[^'\n]*')/g,m=>{strs.push(m);return '\u0001'+String.fromCharCode(65+strs.length-1)+'\u0001';});
    out=out.replace(/\b(const|let|function|return|import|from|export|new|static|void|public|private|int|string|for|while|if|else|using|namespace|def|async|await|record|this|true|false|null|None)\b/g,'<span class="tk-k">$1</span>')
           .replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="tk-n">$1</span>');
    return out.replace(/\u0001([A-Z])\u0001/g,(m,ch)=>'<span class="tk-s">'+strs[ch.charCodeAt(0)-65]+'</span>');
  };
  document.getElementById('main').innerHTML=`
  <section>
    <a href="courses.html" class="mono small">&larr; ${esc(t.course.back)}</a>
    <div class="detail-head" style="margin-top:1.2rem">
      <div>
        <span class="tag" style="border-color:${tr.color};color:${tr.color}">${esc(tr[L]||tr.name)}</span>
        <h1 style="margin:.6rem 0 .4rem">${esc(c.title[L])}</h1>
        <p class="muted">${esc(c.desc[L])}</p>
        <div class="meta" style="margin:.6rem 0 .8rem;padding:0">
          <span>${esc(t.course.level)}: ${esc(c.level[L])}</span>
          ${tt.lessons?`<span>${tt.lessons} ${esc(t.course.lessons)}</span><span>${esc(t.course.total)}: ~${tt.mins} ${esc(t.course.mins)}</span>`:`<span>${esc(t.course.soon)}</span>`}
        </div>
        ${pct===null?'':`<div class="cprog-block">
          <div class="cprog-label"><span>${esc(t.course.progress)}</span><span class="mono">${pct}%</span></div>
          <div class="cprog"><i style="width:${pct}%"></i></div>
        </div>`}
        <h2 style="font-size:1.3rem;margin-top:1.6rem">${esc(t.course.syllabus)}</h2>
        <div class="syllabus" id="syl"></div>
      </div>
      <div>
        <img src="assets/img/cover-${c.track}.svg" alt="" style="border-radius:var(--r);border:1px solid var(--card-brd);width:100%">
        ${c.ytCourse?`<div class="card" style="margin-top:1rem">
          <h3 style="margin:0 0 .6rem;font-size:1.05rem">${esc(t.course.fullVideo)}</h3>
          <div class="yt-mount"><iframe src="https://www.youtube.com/embed/${c.ytCourse.id}?rel=0" title="${esc(c.title[L])}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
          <div class="src-note">${esc(t.lesson.source)}: <a href="https://www.youtube.com/watch?v=${c.ytCourse.id}" target="_blank" rel="noopener">${esc(c.ytCourse.src)}</a></div>
        </div>`:''}
        <div class="card" style="margin-top:1rem">
          <a class="btn btn-acc" href="lesson.html?course=${c.id}&l=${firstOpen?firstOpen.flat:0}" style="width:100%;justify-content:center">${esc(startLabel)}</a>
          <a class="btn btn-ghost" href="playground.html" style="width:100%;justify-content:center;margin-top:.6rem">${esc(t.course.practice)}</a>
        </div>
      </div>
    </div>
    <h2 style="font-size:1.3rem;margin-top:2.2rem">${esc(t.course.sample)}</h2>
    <div class="codeblock">
      <div class="cb-head"><span>sample.${c.track==='cpp'?'cpp':c.track==='python'?'py':c.track==='java'?'java':c.track==='dotnet'?'cs':'js'}</span>
        <button class="copy-btn" id="copyBtn">${esc(t.course.copy)}</button></div>
      <pre id="codePre">${hl(c.sample)}</pre>
    </div>
  </section>`;
  const syl=document.getElementById('syl');
  syl.innerHTML=c.syllabus.map((u,i)=>{
    const items=u.lessons.map((l,li)=>{
      const les=fl.find(x=>x.ui===i&&x.li===li);
      const rec=A.prog.get(c.id,les.flat), open=A.isUnlocked(c,les.flat);
      const state=rec.done?`<span class="ls done">✓ ${esc(t.course.done)}</span>`
        :!les.yt?`<span class="ls soon">${esc(t.course.soon)}</span>`
        :!open?`<span class="ls locked">🔒</span>`
        :rec.pct>0?`<span class="ls wip">${Math.round(rec.pct)}%</span>`:'';
      const inner=`<span class="lt">${esc(l[L==='ar'?0:1])}</span><span class="ld">${les.yt?esc(l[2]):''} ${state}</span>`;
      return `<li>${(open||!les.yt)?`<a href="lesson.html?course=${c.id}&l=${les.flat}">${inner}</a>`:`<span class="lk" title="${esc(t.course.locked)}">${inner}</span>`}</li>`;
    }).join('');
    return `<div class="unit">
      <button data-i="${i}"><span>${esc(u[L])}</span><span class="mono" style="color:var(--acc)">▾</span></button>
      <ol style="display:${i===0?'block':'none'}">${items}</ol>
    </div>`;
  }).join('');
  syl.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const ol=b.parentElement.querySelector('ol');
    ol.style.display=ol.style.display==='none'?'block':'none';
  });
  document.getElementById('copyBtn').onclick=function(){
    navigator.clipboard&&navigator.clipboard.writeText(c.sample);
    this.textContent=t.course.copied; setTimeout(()=>this.textContent=t.course.copy,1500);
  };
};
</script>
</body>
</html>
